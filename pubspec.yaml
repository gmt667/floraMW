name: floramw
description: FloraMW mobile botanical companion frontend.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'
dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/translations.json
    - assets/fonts/LICENSE.txt
    - assets/photo_credits.json
    - assets/plants/
  fonts:
    - family: FloraSans
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Italic.ttf
          style: italic
