databases:
  - name: floramw-db
    plan: basic-256mb
    databaseName: floramw
    user: floramw

services:
  - type: web
    name: floramw-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install .
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: floramw-db
          property: connectionString
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: CORS_ALLOW_CREDENTIALS
        value: "false"
      - key: ENABLE_HSTS
        value: "true"
      - key: RATE_LIMIT_STORAGE
        value: memory
      - key: IDENTIFICATION_PROVIDER
        value: plantnet
      - key: ALLOW_MOCK_PROVIDER
        value: "false"
      - key: PLANTNET_API_KEY
        sync: false
      - key: PLANTNET_PROJECT
        value: all
