databases:
  - name: floramw-db
    plan: free
    databaseName: floramw
    user: floramw
    region: frankfurt

services:
  - type: web
    name: floramw-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install '.[ml]'
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: floramw-db
          property: connectionString
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: CORS_ALLOW_CREDENTIALS
        value: "false"
      - key: ENABLE_HSTS
        value: "true"
      - key: RATE_LIMIT_STORAGE
        value: memory
      - key: IDENTIFICATION_PROVIDER
        value: internal
      - key: INTERNAL_MODEL_MODE
        value: artifact
      - key: INTERNAL_MODEL_ARTIFACT_PATH
        value: ../ml/exports/mobilenetv2_flora.tflite
      - key: INTERNAL_MODEL_LABELS_PATH
        value: ../ml/exports/labels.txt
      - key: INTERNAL_MODEL_LABEL_MAP_PATH
        value: app/identification/model_label_map.json
      - key: ALLOW_MOCK_PROVIDER
        value: "false"
      - key: PLANTNET_API_KEY
        sync: false
      - key: PLANTNET_PROJECT
        value: all
